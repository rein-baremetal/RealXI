name: Build RealXI APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests and layout check
        run: make engine-test check-layout

  build-apk:
    needs: engine-tests
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK, NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed release APK (tags only, needs KEYSTORE_BASE64 secret)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          NAME="RealXI-${GITHUB_REF_NAME//\//-}.apk"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "dist/$NAME"
          else
            cp app/build/outputs/apk/debug/*.apk "dist/$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: RealXI-debug-apk
          path: dist/*.apk

      - name: Publish release (tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
